# ---------------------------------------------------------------------------
# Yeoun Persona Engine — 로컬/온프레미스 배포 정의.
#
# 네트워크 토폴로지:
#   - 이 머신엔 WireGuard 인터페이스 없음. WG 는 다른 머신(Spring Boot 측)에서 처리.
#   - Spring Boot 머신이 같은 LAN 의 다른 노드에서 본 머신의 LAN 사설 IP로 직접 호출.
#   - LAN 의 그 외 기기 차단은 host 방화벽(ufw/iptables의 DOCKER-USER 체인)에서
#     source-IP 화이트리스트로 처리한다 (README 「방화벽 가이드」 단락 참고).
#
# 사전 조건:
#   - Docker Engine 24+
#   - 호스트에 nvidia-container-toolkit 설정
#   - Blackwell GPU 드라이버 (570.x 이상)
# ---------------------------------------------------------------------------
services:
  yeoun-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: yeoun-engine:latest
    container_name: yeoun-engine
    env_file:
      - .env
    ports:
      # 호스트의 모든 인터페이스에서 :8000 listen.
      # LAN 의 Spring Boot 머신이 접근할 수 있도록 노출하고, LAN 의 그 외 기기는
      # host 방화벽(DOCKER-USER 체인)으로 차단한다.
      - "0.0.0.0:8000:8000"
    volumes:
      # 모델 가중치 (~15GB). scripts/download_models.py (#15) 가 채운다.
      - yeoun-models:/models
      # 영구 페르소나 자원 (사진·음성·voice_ref·idle 클립).
      - yeoun-persona:/var/persona
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  yeoun-models:
  yeoun-persona:
